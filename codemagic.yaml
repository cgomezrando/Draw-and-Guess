workflows:
  ios-ipad-only:
    name: iOS iPad Only Build
    max_build_duration: 120
    integrations:
      app_store_connect: Apple Developer
    environment:
      groups:
        - ios_signing_keys
      vars:
        BUNDLE_ID: com.cgr.drawandguess
        P12_PASSWORD: TempBuildPass123
      flutter: 3.32.0
      xcode: 26.6
      cocoapods: default

    scripts:
      - name: Decode certificate private key
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 -D > /tmp/certificate_private_key.pem

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$(cat /tmp/certificate_private_key.pem)" \
            --p12-password "$P12_PASSWORD" \
            --create

      - name: Import certificate into keychain
        script: |
          keychain add-certificates \
            --certificate "/Users/builder/Library/Developer/Xcode/UserData/Certificates/*.p12" \
            --certificate-password "$P12_PASSWORD"

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate app icons
        script: |
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          dart run flutter_launcher_icons

      - name: Force iPad-only device family
        script: |
          sed -i '' -E 's/TARGETED_DEVICE_FAMILY = [^;]+;/TARGETED_DEVICE_FAMILY = 2;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Set minimum iOS version to 15.0
        script: |
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [^;]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          if [ -f ios/Podfile ]; then
            sed -i '' -E "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
            sed -i '' -E "s/^platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          fi
          echo "Deployment target after change:"
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET' ios/Runner.xcodeproj/project.pbxproj

      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
